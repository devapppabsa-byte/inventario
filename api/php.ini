; Ajustes de PHP para el runtime vercel-php.
;
; OJO sobre lo que esto NO arregla: el despliegue corre en Vercel, que rechaza
; con 413 (FUNCTION_PAYLOAD_TOO_LARGE) cualquier cuerpo de peticion mayor a
; 4.5 MB antes de que PHP vea nada. Ese limite es de la plataforma y ningun
; php.ini lo puede levantar. Por eso los topes de este archivo se quedan
; apenas por encima de 4.5 MB: si pusieran 20 MB, PHP creeria que puede
; aceptarlos y la peticion moriria antes, en la frontera de Vercel, sin que
; Laravel pueda dar ningun mensaje.
;
; Lo que si resuelve es el lado local y cualquier host sin ese tope. En local
; el PHP de este equipo venia con upload_max_filesize = 2M, por lo que una sola
; foto de celular ya era rechazada.
;
; Estas cifras coinciden con las de app/Http/Controllers/ticketsController.php
; (MAX_PESO_UNO y MAX_PESO_TOTAL). Si se cambian aqui, cambielas alla.

; El runtime ya sube solo /vendor a .vercelignore; este archivo se elimina en
; build y no se sirve como estatico.

upload_max_filesize = 5M
post_max_size = 5M
memory_limit = 256M
max_file_uploads = 10
